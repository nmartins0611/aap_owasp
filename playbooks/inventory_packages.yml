---
# A03 Software Supply Chain Failures — inventory only. Does not patch.

- name: Inventory installed packages and available updates
  hosts: owasp_targets
  become: true
  gather_facts: true
  vars:
    owasp_findings: []
    owasp_report_path: /var/tmp/owasp-packages-{{ inventory_hostname }}.md
  roles:
    - role: inventory_packages
    - role: owasp_report
