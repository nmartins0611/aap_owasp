---
# A02 / A08 — OpenSCAP drift scan. Fails the job when the profile has findings.
# Requires openscap-scanner and scap-security-guide on the target.

- name: Scan host against OpenSCAP profile
  hosts: owasp_targets
  become: true
  gather_facts: true
  vars:
    owasp_findings: []
    owasp_report_path: /var/tmp/owasp-drift-{{ inventory_hostname }}.md
  roles:
    - role: drift_scan
    - role: owasp_report
  tasks:
    - name: Fail the job when the profile has findings
      ansible.builtin.assert:
        that:
          - owasp_oscap_eval_rc | int == 0
        fail_msg: >-
          OpenSCAP profile {{ owasp_oscap_profile }} reported failed rules on
          {{ inventory_hostname }}. HTML report: {{ owasp_oscap_report_path }}.
          XML results: {{ owasp_oscap_results_path }}.
