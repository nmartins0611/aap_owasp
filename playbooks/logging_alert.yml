---
# A09 Security Logging and Alerting Failures.

- name: Enable audit and system logging
  hosts: owasp_targets
  become: true
  gather_facts: true
  vars:
    owasp_findings: []
    owasp_report_path: /var/tmp/owasp-logging-{{ inventory_hostname }}.md
  roles:
    - role: logging_alert
    - role: owasp_report
